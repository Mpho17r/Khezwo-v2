name: KheZwo quality checks

on:
  push:
    branches:
      - feature/security-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  refresh-security-dependencies:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-security-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: feature/security-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade Next.js and React within patched release lines
        run: npm install --save-exact next@15.5 react@19.2 react-dom@19.2

      - name: Capture npm audit report
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.keys(a.vulnerabilities||{})}, null, 2))" || true

      - name: TypeScript check after upgrade
        run: npx tsc --noEmit

      - name: Production build after upgrade
        run: npm run build

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: upgrade Next.js and React to patched release lines"
          git push origin HEAD:feature/security-foundation

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 14
